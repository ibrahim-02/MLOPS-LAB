# ─────────────────────────────────────────────────────────────
# Logstash Pipeline Config: ML Experiment Tracker
# ─────────────────────────────────────────────────────────────
# Reads JSON logs from the training script and sends to Elasticsearch
#
# IMPORTANT: On WSL, Windows paths are accessed via /mnt/c/...
#
# Usage: bin/logstash -f /mnt/c/Users/mohdi/Downloads/MLOPS-LAB/ELK-LAB/logstash.conf
# ─────────────────────────────────────────────────────────────

input {
  file {
    # WSL path to your training.log (Windows C:\ = /mnt/c/ in WSL)
    path => "/mnt/c/Users/mohdi/Downloads/MLOPS-LAB/ELK-LAB/training.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json
    type => "ml_experiment"
  }
}

filter {
  # Parse timestamp
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Add metadata
  mutate {
    add_field => {
      "pipeline" => "ml_experiment_tracker"
      "ingested_at" => "%{+yyyy-MM-dd'T'HH:mm:ss.SSSZ}"
    }
  }

  # Route different event types
  if [event_type] == "training_complete" {
    mutate {
      convert => {
        "accuracy" => "float"
        "precision" => "float"
        "recall" => "float"
        "f1_score" => "float"
        "roc_auc" => "float"
        "avg_precision" => "float"
        "mcc" => "float"
        "training_time_sec" => "float"
        "true_positives" => "integer"
        "true_negatives" => "integer"
        "false_positives" => "integer"
        "false_negatives" => "integer"
      }
    }
  }

  if [event_type] == "cross_validation" {
    mutate {
      convert => {
        "cv_f1_mean" => "float"
        "cv_f1_std" => "float"
      }
    }
  }

  if [event_type] == "dataset_created" {
    mutate {
      convert => {
        "total_samples" => "integer"
        "num_features" => "integer"
        "fraud_count" => "integer"
        "legit_count" => "integer"
        "fraud_ratio" => "float"
      }
    }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["https://localhost:9200"]
    user => "elastic"
    password => "WjDhsum=TrloKr1MMwBU"
    ssl_certificate_verification => "none"
    index => "ml-experiments-%{+YYYY.MM.dd}"
  }

  # Also print to console for debugging
  stdout {
    codec => rubydebug
  }
}